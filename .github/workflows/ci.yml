name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.10-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://zfunnel_app:zfunnel_app@localhost:5432/zfunnel_test
      STRIPE_MOCK: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-go@v6
        with:
          go-version: "1.24"
      - name: Start stripe-mock (Stripe's official API mock, for contract tests)
        run: |
          go install github.com/stripe/stripe-mock@v0.205.0
          ~/go/bin/stripe-mock -http-port 12111 &

      - name: Create non-superuser app role (RLS must not be bypassed)
        run: psql postgres://postgres:postgres@localhost:5432/postgres -f infra/docker/postgres-init.sql

      - name: License gate
        run: pnpm check:licenses
      - name: Format
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test (includes row-level-security isolation tests)
        run: pnpm test
      - name: Build
        run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: check
    services:
      postgres:
        image: postgres:16.10-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://zfunnel_app:zfunnel_app@localhost:5432/zfunnel
      BETTER_AUTH_SECRET: ci-only-secret-0123456789abcdefghijklmnop
      BETTER_AUTH_URL: http://localhost:3000
      ROOT_DOMAIN: localhost:3001
      PAYMENTS_TEST_MODE: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: psql postgres://postgres:postgres@localhost:5432/postgres -f infra/docker/postgres-init.sql
      - run: pnpm db:migrate
      - run: pnpm build
      - run: pnpm --filter @zfunnel/e2e exec playwright install --with-deps chromium
      - run: pnpm e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
