# ZFunnel production stack. Everything lives in the "zfunnel" compose project on its own
# private network, so it can share a server with other apps without touching them.
# Usage (from the repo root on the server): ./infra/deploy/deploy.sh
name: zfunnel

x-app-env: &app-env
  DATABASE_URL: postgres://zfunnel_app:${POSTGRES_APP_PASSWORD}@postgres:5432/zfunnel
  REDIS_URL: redis://redis:6379
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
  BETTER_AUTH_URL: https://app.${ROOT_DOMAIN}
  ROOT_DOMAIN: ${ROOT_DOMAIN}
  SITES_CNAME_TARGET: sites.${ROOT_DOMAIN}
  SITES_IPV4: ${SERVER_IPV4:-}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
  NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  STRIPE_PLATFORM_WEBHOOK_SECRET: ${STRIPE_PLATFORM_WEBHOOK_SECRET:-}
  PAYMENTS_TEST_MODE: ${PAYMENTS_TEST_MODE:-false}
  ANALYTICS_SALT: ${ANALYTICS_SALT}
  # Email (broadcasts, automations, customer sign-in links). Any SMTP provider.
  SMTP_URL: ${SMTP_URL:-}
  EMAIL_FROM: ${EMAIL_FROM:-}
  # Optional AI copywriter.
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  AI_MODEL: ${AI_MODEL:-claude-sonnet-5-5}
  SECRETS_KEY: ${SECRETS_KEY:-}
  PLATFORM_ADMIN_EMAILS: ${PLATFORM_ADMIN_EMAILS:-}

services:
  postgres:
    image: postgres:16.10-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      APP_DB_PASSWORD: ${POSTGRES_APP_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 20
    networks: [internal]

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes: [redisdata:/data]
    networks: [internal]

  migrate:
    build: { context: ../.., target: migrate }
    image: zfunnel-migrate:latest
    environment: *app-env
    depends_on:
      postgres: { condition: service_healthy }
    networks: [internal]
    restart: "no"

  web:
    build:
      context: ../..
      target: web
      args: { NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: "${STRIPE_PUBLISHABLE_KEY:-}" }
    image: zfunnel-web:latest
    restart: unless-stopped
    environment: *app-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_started }
    networks: [internal]

  sites:
    build: { context: ../.., target: sites }
    image: zfunnel-sites:latest
    restart: unless-stopped
    environment: *app-env
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [internal]

  worker:
    build: { context: ../.., target: worker }
    image: zfunnel-worker:latest
    restart: unless-stopped
    environment: *app-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_started }
    networks: [internal]

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    environment:
      ROOT_DOMAIN: ${ROOT_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    # If another reverse proxy already owns 80/443 on this server, set CADDY_HTTP_PORT and
    # CADDY_HTTPS_PORT to free ports and see docs/DEPLOYMENT.md ("Sharing ports").
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on: [web, sites]
    networks: [internal]

volumes:
  pgdata:
  redisdata:
  caddydata:
  caddyconfig:

networks:
  internal:
    name: zfunnel_internal
